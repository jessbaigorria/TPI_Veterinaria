{% extends "base.html" %}
{% from "componentes/macros.html" import encabezado %}
{% block contenido %}
{% call encabezado("Reservar turno", "Se valida que el profesional no tenga otro turno superpuesto") %}{% endcall %}
<div class="card" style="max-width: 820px"><div class="card-body">
<form method="post" action="/clinica/agenda/reservar">
  <div class="row g-3">
    <div class="col-md-6">
      <label class="form-label">Titular <span class="text-danger">*</span></label>
      <input class="form-control form-control-sm mb-1" placeholder="🔎 Buscar por apellido o DNI" data-filtra="titular_id">
      <select class="form-select" id="titular_id" name="titular_id" required>
        <option value="">— Elegí el titular —</option>
        {% for t in titulares %}<option value="{{ t.id }}" {{ 'selected' if (mascota and mascota.titular.id == t.id) or previo.titular_id == t.id|string }}>{{ t.nombre_completo() }} · DNI {{ t.dni }}</option>{% endfor %}
      </select>
    </div>
    <div class="col-md-6">
      <label class="form-label">Mascota <span class="text-danger">*</span></label>
      <select class="form-select mt-md-4" name="mascota_id" required data-mascotas-de="titular_id" data-aviso="aviso-vacunas"
              data-seleccionada="{{ mascota.id if mascota else previo.mascota_id }}"></select>
    </div>
    <div class="col-12" id="aviso-vacunas"></div>
    <div class="col-md-6">
      <label class="form-label">Profesional <span class="text-danger">*</span></label>
      <select class="form-select" name="profesional_id" required>
        {% for p in profesionales %}<option value="{{ p.id }}" {{ 'selected' if query.profesional == p.id|string or previo.profesional_id == p.id|string }}>{{ p.nombre_completo() }} ({{ p.especialidad }})</option>{% endfor %}
      </select>
    </div>
    <div class="col-md-6">
      <label class="form-label">Tipo</label>
      <select class="form-select" name="tipo">
        {% for t in enums.TipoAtencion %}<option value="{{ t.value }}" {{ 'selected' if (query.tipo or previo.tipo) == t.value }}>{{ t.etiqueta }}</option>{% endfor %}
      </select>
    </div>
    <div class="col-md-4"><label class="form-label">Fecha <span class="text-danger">*</span></label>
      <input type="date" class="form-control" name="fecha" required value="{{ query.fecha or previo.fecha or reloj.hoy() }}"></div>
    <div class="col-md-4"><label class="form-label">Inicio <span class="text-danger">*</span></label>
      <input type="time" class="form-control" name="hora_inicio" required step="900" value="{{ query.hora or previo.hora_inicio or '10:00' }}"></div>
    <div class="col-md-4"><label class="form-label">Fin</label>
      <input type="time" class="form-control" name="hora_fin" step="900" value="{{ previo.hora_fin }}"><div class="form-text">Vacío = 30 minutos</div></div>
    <div class="col-12"><label class="form-label">Motivo (lo que cuenta el cliente)</label>
      <input class="form-control" name="motivo" value="{{ previo.motivo or ('Plan de vacunación' if query.tipo == 'VACUNACION') }}"></div>
    <div class="col-md-4"><label class="form-label">¿Asiste el titular?</label>
      <select class="form-select" name="asiste_titular" id="asiste"><option value="1">Sí</option><option value="0">No</option></select></div>
    <div class="col-md-8" data-muestra-si="asiste:0"><label class="form-label">Responsable presente <span class="text-danger">*</span></label>
      <input class="form-control" name="responsable_presente" data-requerido="1" placeholder="Nombre y vínculo"></div>
  </div>
  <div class="mt-4 d-flex gap-2"><button class="btn btn-portal"><i class="bi bi-check-lg"></i> Reservar</button>
    <a href="/clinica/agenda" class="btn btn-outline-secondary">Volver</a></div>
</form>
</div></div>
{% endblock %}
