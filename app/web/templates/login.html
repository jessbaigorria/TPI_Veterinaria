{% extends "base.html" %}
{% block contenido %}
<div class="login-centro">
  <div class="text-center mb-4">
    <h2 class="fw-bold">VetRed – Red de Clínicas y Laboratorio Central</h2>
    <p class="text-muted mb-0">Elegí el portal con el que vas a trabajar.</p>
    {% if actual %}<div class="small text-muted mt-2">Sesión actual: {{ actual.sede_nombre }} ·
      <a href="/{{ actual.portal }}">Continuar</a> · <a href="/salir">Salir</a></div>{% endif %}
  </div>
  <div class="row g-4 justify-content-center w-100">
    <div class="col-md-5 col-lg-4">
      <div class="card tarjeta-portal h-100"><div class="card-body p-4">
        <h4 class="mb-3"><i class="bi bi-hospital text-secondary"></i> Entrar como Clínica</h4>
        <form method="post" action="/ingresar">
          <input type="hidden" name="portal" value="clinica">
          <label class="form-label" for="clinica_id">Clínica</label>
          <select class="form-select mb-3" name="clinica_id" id="clinica_id" required>
            {% for c in clinicas %}<option value="{{ c.id }}">{{ c.nombre }}</option>{% endfor %}
          </select>
          <button class="btn btn-clinica w-100"><i class="bi bi-box-arrow-in-right"></i> Ingresar al Portal Clínica</button>
        </form>
      </div></div>
    </div>
    <div class="col-md-5 col-lg-4">
      <div class="card tarjeta-portal lab h-100"><div class="card-body p-4">
        <h4 class="mb-3"><i class="bi bi-eyedropper text-secondary"></i> Entrar como Laboratorio</h4>
        <form method="post" action="/ingresar">
          <input type="hidden" name="portal" value="laboratorio">
          <label class="form-label" for="laboratorio_id">Laboratorio</label>
          <select class="form-select mb-3" name="laboratorio_id" id="laboratorio_id" required>
            {% for l in laboratorios %}<option value="{{ l.id }}">{{ l.nombre }}</option>{% endfor %}
          </select>
          <button class="btn btn-lab w-100"><i class="bi bi-box-arrow-in-right"></i> Ingresar al Portal Laboratorio</button>
        </form>
      </div></div>
    </div>
  </div>
</div>
{% endblock %}
